      <stop offset="0%" stop-color="#FF453A"/>
      <stop offset="100%" stop-color="#CC1F1A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Playlist lines (top right area) -->
